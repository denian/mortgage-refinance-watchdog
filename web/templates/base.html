<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortgage Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-brand" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--indigo)"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Mortgage Monitor
    </a>
    <div class="navbar-links">
      <a href="/">Report</a>
      <a href="/reports">History</a>
      <a href="/settings">Settings</a>
      <form method="POST" action="/run" style="display:inline">
        <button type="submit" class="btn-run">Run Now</button>
      </form>
    </div>
  </nav>

  {% if flash %}
  <div class="flash flash-{{ flash.kind }}">
    {{ flash.message }}
  </div>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    Mortgage Monitor &mdash; powered by FRED / Freddie Mac PMMS data
  </footer>
</body>
</html>
